        <style>

            body {
                background-color: #030929;
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 20px;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            header {
                background-color: #eedcd0;
                color: #4a2e35;
                padding: 15px 30px;
                text-align: center;
                text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
                border-radius: 8px;
                margin-bottom: 30px;
                width: 100%;
                max-width: 800px;
                box-sizing: border-box;
            }

            .container {
                display: flex;
                flex-direction: column;
                gap: 30px;
                width: 100%;
                max-width: 800px;
            }

            section {
                padding: 20px;
                border-radius: 12px;
                background-color: #ffffff;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }

            .name-tag {
                color: #fffefd;
                font-size: 24px;
                font-weight: bold;
                text-align: center;
                background-color: rgb(0, 0, 0);
                padding: 8px;
                border-radius: 6px;
                margin-top: 0;
                margin-bottom: 15px;
            }

            video {
                width: 100%;
                height: auto;
                border-radius: 6px;
                display: block;
            }
            /* Background Starfield Container */
            .starfield {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                pointer-events: none; /* Allows you to click elements underneath */
                z-index: -1;          /* Keeps stars behind all your content */
                overflow: hidden;
            }

            /* Individual Star Styling & Twinkle Animation */
            .star {
                position: absolute;
                background-color: #ffffff;
                border-radius: 100%;
                opacity: 0.8;
                animation: twinkle 2s ease-in-out infinite;
            }

            @keyframes twinkle {
                0%, 100% {
                    opacity: 0.2;
                    transform: scale(0.8);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.2);
                    box-shadow: 0 0 6px #fff, 0 0 10px #70a1ff;
                }
            }
        </style>

/* 👇 PUT THE CSS HERE (inside <style>) */

        .orbit {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 22px;
            font-size: 34px;
        }

        .orbit span {
            display: inline-block;
            animation: bob 3s ease-in-out infinite;
        }

        .orbit span:nth-child(1) { animation-delay: 0s; }
        .orbit span:nth-child(2) { animation-delay: 0.3s; }
        .orbit span:nth-child(3) { animation-delay: 0.6s; }
        .orbit span:nth-child(4) { animation-delay: 0.9s; }
        .orbit span:nth-child(5) { animation-delay: 1.2s; }
        .orbit span:nth-child(6) { animation-delay: 1.5s; }
        .orbit span:nth-child(7) { animation-delay: 1.8s; }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-14px); }
        }

        </style>
